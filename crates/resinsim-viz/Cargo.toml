[package]
name = "resinsim-viz"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "resinsim-viz"
path = "src/main.rs"

# Second cucumber harness (ADR-0024): a `harness = false` binary, same
# shape as resinsim-core's `uat_gherkin`, so `.config/nextest.toml`'s
# `not binary(/^uat_/)` excludes it identically. See `cargo uat-viz` in
# .cargo/config.toml and docs/adr/0024-second-uat-harness-in-resinsim-viz.md.
[[test]]
name = "uat_viz_gherkin"
harness = false

[dependencies]
resinsim-core = { path = "../resinsim-core" }
bevy = { version = "0.18", default-features = true }
bevy_panorbit_camera = "0.34"
# bevy_egui 0.39 (egui 0.33) ↔ egui_plot 0.34 — verified version chain.
# bevy_egui 0.39 deprecates `enable_multipass_for_primary_context`; use
# `EguiPlugin::default()`. egui_plot 0.34 targets egui 0.33; 0.33 would
# target egui 0.32 (off-by-one). See ADR-0011.
bevy_egui = "0.39"
egui_plot = "0.34"
clap = { version = "4", features = ["derive"] }
# Pass 5 layout persistence: serde the v2 PaneGrid layout to a JSON
# file under the user's per-app config dir. `directories` resolves
# the platform-correct path (~/Library/Application Support/... on
# macOS); serde + serde_json handle the on-disk shape. All three are
# small, stable, no-cfg deps.
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Forwarding feature: enabling on this crate cascades to resinsim-core's
# field-sim feature, which gates the voxel cure heatmap rendering path
# (ADR-0017, t2f1).
field-sim = ["resinsim-core/field-sim"]

[dev-dependencies]
# Tempdir TOML round-trips for issue 04's pairing-violation +
# save/load-sim tests, and the Pass 5 v2 layout-persistence tests. Also
# used by uat_viz_gherkin's VizWorld for scenario-scoped temp paths.
tempfile = "3"
# uat_viz_gherkin's cucumber harness (ADR-0024) — version-matched to
# resinsim-core's tests/uat_gherkin.rs dev-deps.
cucumber = "0.22.1"
tokio = { version = "1", features = ["macros", "rt"] }
# Only used via the cross-crate #[path] include of resinsim-core's
# tests/uat_steps/extract.rs, which itself depends on pulldown-cmark and
# nothing else. Version-matched to resinsim-core's Cargo.toml.
pulldown-cmark = { version = "0.13.3", default-features = false }

[lints]
workspace = true
