[package]
name = "resinsim-inspect"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "resinsim"
path = "src/main.rs"

[dependencies]
resinsim-core = { path = "../resinsim-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[features]
# Forwarding feature: enabling on this crate cascades to resinsim-core's
# field-sim feature, which gates the voxel cure path (ADR-0017, t2f1).
# Default builds remain lean (no ndarray dep, no voxel modules compiled).
field-sim = ["resinsim-core/field-sim"]
# ADR-0025: GPU thermal solver forwarding. Implies field-sim.
gpu = ["field-sim", "resinsim-core/gpu"]

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3"
# t2f6-field-inspector: field_inspect_cli.rs builds synthetic voxel
# fields in-process (same convention as resinsim-core's
# sidecar_roundtrip_integration.rs) via CureField/StrainField/etc.'s
# `from_persistence_parts(..., Array3<_>, ...)` constructors, which
# take ndarray types directly. Matches resinsim-core's own `ndarray`
# version pin.
ndarray = "0.16"

[lints]
workspace = true
