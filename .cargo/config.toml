[build]
rustflags = ["-Z", "threads=8", "-Aunused_imports"]

# The cucumber UAT suite cannot join the nextest default profile: its binary
# is `harness = false` and aborts nextest's test enumeration, so
# `.config/nextest.toml` excludes every `uat_*` target. That exclusion made
# the suite invisible to every gate, and it sat red on main for months with
# nobody able to see it.
#
# This alias is the discoverable replacement — `cargo uat` beside the
# four-config matrix, findable from tooling rather than only from
# agent-constraints/implementation-conventions.md.
#
# `uat-field-sim` is the field-sim-feature sibling: neither `uat` nor the
# four-config matrix builds/runs the cucumber binary under `--features
# field-sim`, so without this alias the field-sim UAT run is discoverable
# only from agent-constraints/implementation-conventions.md too. Both
# aliases must be run whenever spec/uat/*.md or tests/uat_steps/ changes.
[alias]
uat = "test --test uat_gherkin -p resinsim-core"
uat-field-sim = "test --test uat_gherkin -p resinsim-core --features field-sim"

[profile.dev]
opt-level = 0
